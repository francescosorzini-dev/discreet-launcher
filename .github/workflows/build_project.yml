name: Build Project

on:
  # Automatically run the workflow after a "git push"
  push:
    branches: [ main ]

  # Allows to run the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build the debug APK with Gradle and publish it
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Android SDK (official command-line tools)
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Read version and changelog
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          CODE=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          {
            echo "## Changelog"
            echo '```'
            cat "app/src/main/assets/changelog-en/$CODE.txt" 2>/dev/null || echo "(no changelog for $CODE)"
            echo '```'
            echo
            echo "Debug build ${{ github.run_number }} from ${{ github.sha }}"
          } > release_notes.md
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk discreet-launcher-${{ steps.meta.outputs.version }}-build${{ github.run_number }}.apk
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: discreet-launcher-debug
          path: discreet-launcher-*.apk
      - name: Publish APK as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}-build${{ github.run_number }}
          name: ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body_path: release_notes.md
          files: discreet-launcher-*.apk
