name: Build Project

on:
  # Automatically run the workflow after a "git push"
  push:
    branches: [ main ]

  # Allows to run the workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Build the debug APK with Gradle and publish it
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk discreet-launcher-build${{ github.run_number }}.apk
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: discreet-launcher-debug
          path: discreet-launcher-build*.apk
      - name: Publish APK as GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Debug build from ${{ github.sha }}
          files: discreet-launcher-build*.apk
