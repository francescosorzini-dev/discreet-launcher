name: UI Check

# Run the app on emulators and store screenshots in the "ui-screenshots" branch
on:
  push:
    branches: [ 'feature/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [ 30, 35 ]
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ui_check.sh app/build/outputs/apk/debug/app-debug.apk screenshots/api-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-api-${{ matrix.api }}
          path: screenshots

  publish:
    needs: screenshots
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: collected
      - name: Push screenshots to the ui-screenshots branch
        run: |
          set -euo pipefail
          mkdir site && cd site
          git init -q -b ui-screenshots
          for d in ../collected/*/ ; do cp -r "$d"* . ; done
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "UI screenshots ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-screenshots
